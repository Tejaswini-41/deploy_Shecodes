name: CI/CD Pipeline

on:
  push:
    branches: [ compose ]  
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Debug step to check directory structure
      - name: Debug Directory Structure
        run: |
          ls -la
          ls -la ./client || echo "Client directory not found"
          find ./client -name "dockerfile" -o -name "Dockerfile" || echo "No dockerfile found in client directory"
          find . -name "dockerfile" -o -name "Dockerfile"

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          # Using lowercase file name as specified in your project
          file: ./client/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shecodes-frontend:latest

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shecodes-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # Create a deployment script locally
          cat > deploy.sh << 'EOFSCRIPT'
          #!/bin/bash
          
          # Create docker-compose.yml
          mkdir -p ~/shecodes
          cd ~/shecodes
          
          cat > docker-compose.yml << COMPOSE
          version: "3"
          services:
            frontend:
              image: ${DOCKERHUB_USERNAME}/shecodes-frontend:latest
              ports:
                - "80:80"
              restart: unless-stopped
              depends_on:
                - backend
              networks:
                - sheCodes-network
            backend:
              image: ${DOCKERHUB_USERNAME}/shecodes-backend:latest
              ports:
                - "5000:5000"
              restart: unless-stopped
              environment:
                - MONGO_URI=${MONGO_URI}
                - JWT_SECRET=${JWT_SECRET}
                - PORT=5000
              networks:
                - sheCodes-network
          networks:
            sheCodes-network:
              driver: bridge
          COMPOSE
          
          # Login to Docker, deploy
          echo "${DOCKERHUB_TOKEN}" | docker login -u ${DOCKERHUB_USERNAME} --password-stdin
          docker-compose pull
          docker-compose down
          docker-compose up -d
          docker system prune -af
          docker logout
          EOFSCRIPT
          
          # Make the script executable
          chmod +x deploy.sh
          
          # Copy the script to the server
          scp -o StrictHostKeyChecking=no deploy.sh ${SERVER_USER}@${SERVER_HOST}:~/deploy.sh
          
          # Run the script with environment variables
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} \
            "export DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             export DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
             export MONGO_URI='$MONGO_URI' \
             export JWT_SECRET='$JWT_SECRET' && \
             bash ~/deploy.sh && \
             rm ~/deploy.sh"