name: tej CI/CD Pipeline 

on:
  push:
    branches: [ compose ]  
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Updated to use your actual secret names
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Debug step to check directory structure
      - name: Debug Directory Structure
        run: |
          ls -la
          ls -la ./client || echo "Client directory not found"
          find ./client -name "dockerfile" -o -name "Dockerfile" || echo "No dockerfile found in client directory"
          find . -name "dockerfile" -o -name "Dockerfile"

      # Updated Docker build and push for frontend with correct variable names
      - name: Build and Push Frontend Docker image
        run: |
          cd client
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/shecodes-frontend:latest -f dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/shecodes-frontend:latest

      # Updated Docker build and push for backend with correct variable names
      - name: Build and Push Backend Docker image
        run: |
          cd server
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/shecodes-backend:latest -f Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/shecodes-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # Create a deployment script locally
          cat > deploy.sh << 'EOFSCRIPT'
          #!/bin/bash
          set -e

          # Setup logging
          exec > >(tee -a ~/deployment.log) 2>&1
          echo "Starting deployment at $(date)"

          # Install Docker for Amazon Linux 2023 if not present
          if ! command -v docker &> /dev/null; then
            echo "Installing Docker for Amazon Linux 2023..."
            sudo yum update -y
            sudo yum install docker -y
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER
            echo "Docker installed successfully"
          else
            echo "Docker already installed"
          fi

          # Use Docker Compose through Docker directly
          # This avoids the library dependency issues with the binary version
          echo "Setting up Docker Compose through Docker..."
          
          # Create a script to run docker-compose as a container
          cat > ~/docker-compose << 'EOF'
          #!/bin/bash
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" \
            -w="$PWD" \
            docker/compose:1.29.2 "$@"
          EOF
          
          sudo chmod +x ~/docker-compose
          sudo mv ~/docker-compose /usr/local/bin/docker-compose
          echo "Docker Compose setup completed"
          
          # Create docker-compose.yml
          mkdir -p ~/shecodes
          cd ~/shecodes
          
          echo "Creating docker-compose.yml..."
          cat > docker-compose.yml << COMPOSE
          version: "3"
          services:
            frontend:
              image: ${DOCKERHUB_USERNAME}/shecodes-frontend:latest
              ports:
                - "80:80"
              restart: unless-stopped
              depends_on:
                - backend
              networks:
                - sheCodes-network
            backend:
              image: ${DOCKERHUB_USERNAME}/shecodes-backend:latest
              ports:
                - "5000:5000"
              restart: unless-stopped
              environment:
                - MONGO_URI=${MONGO_URI}
                - JWT_SECRET=${JWT_SECRET}
                - PORT=5000
              networks:
                - sheCodes-network
          networks:
            sheCodes-network:
              driver: bridge
          COMPOSE
          
          echo "Logging in to Docker Hub..."
          # Login to Docker, deploy
          echo "${DOCKERHUB_TOKEN}" | docker login -u ${DOCKERHUB_USERNAME} --password-stdin
          
          echo "Pulling latest images..."
          docker-compose pull
          
          echo "Stopping existing containers..."
          docker-compose down || true
          
          echo "Starting containers..."
          docker-compose up -d
          
          echo "Cleaning up unused Docker resources..."
          docker system prune -af
          
          echo "Logging out from Docker Hub..."
          docker logout
          
          echo "Deployment completed successfully at $(date)"
          EOFSCRIPT
          
          # Make the script executable
          chmod +x deploy.sh
          
          # Copy the script to the server
          scp -o StrictHostKeyChecking=no deploy.sh ${SERVER_USER}@${SERVER_HOST}:~/deploy.sh
          
          # Run the script with environment variables
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} \
            "export DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             export DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
             export MONGO_URI='$MONGO_URI' \
             export JWT_SECRET='$JWT_SECRET' && \
             bash ~/deploy.sh && \
             rm ~/deploy.sh"