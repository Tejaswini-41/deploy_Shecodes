name: SheCodes CI/CD Pipeline

on:
  push:
    branches: [ compose, main, master ]  
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/dockerfile  
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shecodes-frontend:latest

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shecodes-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # Create a script to run on the server
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          
          # Export environment variables
          export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"
          export MONGO_URI="${MONGO_URI}"
          export JWT_SECRET="${JWT_SECRET}"
          
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'INNER_EOF'
          mkdir -p ~/shecodes
          cd ~/shecodes
          
          # Create docker-compose.yml
          cat > docker-compose.yml << COMPOSE
          version: "3"
          services:
            frontend:
              image: ${DOCKERHUB_USERNAME}/shecodes-frontend:latest
              ports:
                - "5173:80"
              restart: unless-stopped
              depends_on:
                - backend
              networks:
                - sheCodes-network
            backend:
              image: ${DOCKERHUB_USERNAME}/shecodes-backend:latest
              ports:
                - "5000:5000"
              restart: unless-stopped
              environment:
                - MONGO_URI=${MONGO_URI}
                - JWT_SECRET=${JWT_SECRET}
                - PORT=5000
              networks:
                - sheCodes-network
          networks:
            sheCodes-network:
              driver: bridge
          COMPOSE
          
          # Login to Docker, deploy
          echo "${DOCKERHUB_TOKEN}" | docker login -u ${DOCKERHUB_USERNAME} --password-stdin
          docker-compose pull
          docker-compose down
          docker-compose up -d
          docker system prune -af
          docker logout
          INNER_EOF
          EOF
          
          # Make the script executable
          chmod +x deploy.sh
          
          # Copy the script to the server
          scp -o StrictHostKeyChecking=no deploy.sh ${SERVER_USER}@${SERVER_HOST}:~/deploy.sh
          
          # Run the script with environment variables
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} \
            "export DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             export DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
             export MONGO_URI='$MONGO_URI' \
             export JWT_SECRET='$JWT_SECRET' && \
             bash ~/deploy.sh && \
             rm ~/deploy.sh"
