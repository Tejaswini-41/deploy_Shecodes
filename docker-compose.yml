version: "3"

services:
  frontend:
    build:
      context: ./client
      dockerfile: dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - sheCodes-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - sheCodes-network
  
networks:
  sheCodes-network:
    driver: bridge
